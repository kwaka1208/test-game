name: Idea
description: Suggest a new room, item, or feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to add?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it a good idea?
      description: How does it make the game better for players?
    validations:
      required: true
